name: Project Guard
on: [pull_request] # Now it only runs when you try to merge!

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # This tells the robot to "download" your code

      - name: Verify Index File
        run: |
          if [ -f index.html ]; then
            echo "Success: index.html found!"
          else
            echo "Error: index.html is missing!"
            exit 1 # This "breaks" the robot and turns the check red
          fi